<title id="title">AI Manufacturing Support Agent AWS Architecture</title>
<desc id="desc">Dark AWS architecture diagram showing manufacturing users, API Gateway, Lambda orchestration, Amazon Bedrock, S3 knowledge, optional OpenSearch vector retrieval and ERP integration, plus CloudWatch, IAM and KMS.</desc>
